name: Release

on:
  push:
    tags: ["*"]
  # Run by hand to release the version in manifest.json; creates its tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="$(node -p "require('./manifest.json').version")"; fi
          gh release create "$TAG" main.js manifest.json --target "$GITHUB_SHA" --title "$TAG" --notes "Shared Folder Sync $TAG"
